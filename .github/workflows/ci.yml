name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'exp/**']
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: 前端（类型检查 / 单测 / 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 网页/front/cassava_front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 网页/front/cassava_front/package-lock.json
      - run: npm ci
      # 注意：tsconfig.json 是 solution 风格（files: []），必须用 tsc -b，
      # 直接 `tsc --noEmit` 会「成功」但一个文件都没检查。
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build

  backend:
    name: 后端（Django check / 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 网页/back/cassavaBack
    env:
      # dev 设置全程用 sqlite，不碰生产库；预测任务线程在这里关掉。
      DJANGO_SETTINGS_MODULE: cassavaBack.dev_settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: 网页/back/requirements.txt
      - name: 安装依赖（CPU 版 torch，避免拉 CUDA 轮子）
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -r ../../requirements.txt
      - run: python manage.py check
      - run: python manage.py test predict --settings=cassavaBack.dev_settings
      - name: 生产配置自检
        # 只报告，不阻断：生产 .env 不在仓库里，--deploy 的部分告警需要真实密钥才能消除。
        run: python manage.py check --deploy || true
