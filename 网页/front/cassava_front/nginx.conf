user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    # 上传体积上限。后端 DATA_UPLOAD_MAX_MEMORY_SIZE 默认 550MB，
    # 这里留出余量；不加这一行时 nginx 默认只有 1MB，大图上传会被 413 截断。
    client_max_body_size 560m;

    # ---- Gzip（2026-10-27 修正）----
    # 旧配置只写了 `gzip on;`，nginx 默认只压 text/html，
    # 实测线上 JS/CSS 全部未压缩（index-*.js 153KB 原样传输）。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/vnd.api+json
        image/svg+xml
        font/woff
        font/woff2;

    include /etc/nginx/conf.d/*.conf;

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # 带 hash 的构建产物：长缓存（内容变了文件名就变）
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # 入口 HTML：绝不缓存，否则发版后用户拿不到新的 asset 引用
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
            expires -1;
        }

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

        # ------------------------------------------------------------------
        # TODO(批次1.3 待部署核对)：线上 nginx 确实把 /api 反代到了后端
        # （实测 https://www.cassavappd.com/api/images/ 返回 200 JSON），
        # 但仓库里没有这一段，上游地址只有服务器上那份配置知道。
        # 拿到真实 upstream 后按下面骨架补上，并用 `nginx -t` 校验：
        #
        # location /api/ {
        #     proxy_pass         http://<后端地址>:8000;
        #     proxy_set_header   Host              $host;
        #     proxy_set_header   X-Real-IP         $remote_addr;
        #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        #     proxy_set_header   X-Forwarded-Proto $scheme;
        #     proxy_read_timeout 300s;   # 预测任务轮询/导出
        #     proxy_send_timeout 300s;
        # }
        # ------------------------------------------------------------------
    }
}
